<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ConduitCredit logo">
  <defs>
    <linearGradient id="cc-g" x1="120" y1="140" x2="392" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BEF264"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="cc-glow" cx="0.42" cy="0.32" r="0.78">
      <stop stop-color="#BEF264" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#BEF264" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- panel -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="#0B0F0E"/>
  <rect x="16.75" y="16.75" width="478.5" height="478.5" rx="115.25" stroke="#202A27" stroke-width="1.5"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#cc-glow)"/>
  <!-- the conduit: a bold C opening to the right (income channelled into credit) -->
  <path d="M348 184 A128 128 0 1 0 348 328" stroke="url(#cc-g)" stroke-width="48" stroke-linecap="round" fill="none"/>
  <!-- verified credit token cradled in the conduit's mouth -->
  <circle cx="356" cy="256" r="46" fill="#0B0F0E"/>
  <circle cx="356" cy="256" r="46" fill="url(#cc-glow)"/>
  <circle cx="356" cy="256" r="39" fill="none" stroke="url(#cc-g)" stroke-width="14"/>
  <path d="M338 256 l13 14 l25 -29" stroke="#BEF264" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
